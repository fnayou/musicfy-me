name: Bug report
description: Report a reproducible problem
title: ""
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and expected outcome
      description: What happened, and what should happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps, relevant environment, and exact error output. Remove secrets.
    validations:
      required: true
